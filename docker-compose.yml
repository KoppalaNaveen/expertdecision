services:
  postgres:
    image: postgres:15-alpine
    container_name: edrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edrp-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edrp-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - edrp-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: edrp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      API_URL: ${BACKEND_URL:-http://backend:8000}
      SECRET_KEY: ${SECRET_KEY}
      HOST: "0.0.0.0"
      PORT: "5000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - edrp-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  edrp-network:
    driver: bridge
