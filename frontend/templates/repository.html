{% extends "base.html" %}

{% block css %}
<style>
.repo-card {
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    height: 100%;
    display: flex;
    flex-direction: column;
}
.repo-card:hover {
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
    transform: translateY(-2px);
    border-color: #CBD5E1;
}
.repo-card-title {
    font-size: 15.5px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
}
.repo-card-desc {
    font-size: 13px;
    color: #64748B;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 12px;
    line-height: 1.55;
}
.search-hero {
    background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 100%);
    border-radius: 18px;
    padding: 2.25rem 2rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15);
}
.tag-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    background: #F1F5F9;
    color: #475569;
    border: 1px solid #E2E8F0;
    transition: all 0.15s ease;
    cursor: pointer;
}
.tag-badge:hover {
    background: #EEF2FF;
    color: #4F46E5;
    border-color: #C7D2FE;
}
.tag-filter-pill {
    background: rgba(255,255,255,0.08);
    color: #CBD5E1;
    font-size: 11.5px;
    font-weight: 500;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.14);
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.tag-filter-pill:hover {
    background: rgba(255,255,255,0.18);
    color: #FFFFFF;
    border-color: rgba(255,255,255,0.3);
}
.tag-filter-pill.active {
    background: #3B82F6;
    color: #FFFFFF;
    border-color: #3B82F6;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
}
</style>
{% endblock %}

{% block content %}
<!-- Hero Search -->
<div class="search-hero">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
        <div>
            <h2 class="fw-bold text-white mb-1">📚 Knowledge Repository</h2>
            <p class="mb-0" style="color:#94A3B8;font-size:13.5px;">Search approved decisions by keywords, categories, or specific tags.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary bg-opacity-25 text-white border border-primary border-opacity-50 rounded-pill px-3 py-1.5" style="font-size: 11px;">
                <i class="bi bi-shield-check me-1"></i> Institutional Memory
            </span>
        </div>
    </div>

    <!-- Search Box -->
    <div class="input-group mt-3 mb-4" style="max-width:700px;">
        <span class="input-group-text" style="background:#1E293B;border-color:#334155;color:#64748B;">
            <i data-lucide="search" style="width:18px;height:18px;"></i>
        </span>
        <input type="text" id="repoSearch" class="form-control" placeholder="Search by title, description, category, #tag (e.g. #Cloud, #Budget), or DEC-ID..."
               style="background:#1E293B;border-color:#334155;color:#F8FAFC;font-size:14px;padding: 10px 14px;" oninput="filterRepo()">
        <button class="btn btn-secondary px-3" id="btnClearSearch" style="background:#334155;border-color:#334155;color:#94A3B8;display:none;" onclick="clearSearch()" title="Clear Search">✕</button>
        <button class="btn fw-semibold px-4" style="background:#2563EB;color:white;border-color:#2563EB;" onclick="filterRepo()">Search</button>
    </div>

    <!-- Category Filters Row -->
    <div class="d-flex gap-2.5 mt-4 mb-3.5 align-items-center flex-wrap">
        <span class="text-muted fw-semibold me-1" style="font-size:12px;color:#94A3B8 !important;">Category:</span>
        <button id="catAll" class="btn btn-sm px-3.5 py-1.5 fw-semibold" style="background:#2563EB;color:white;font-size:11.5px;border-radius:20px;" onclick="setCat('', this)">All</button>
        <div id="categoryBtns" class="d-flex gap-2 flex-wrap"></div>
    </div>

    <!-- Tag Filters Row -->
    <div class="mt-3.5 pt-3 border-top border-secondary border-opacity-25">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="text-muted fw-semibold d-flex align-items-center gap-1.5 me-1" style="font-size:12px;color:#94A3B8 !important;">
                <i class="bi bi-tags-fill text-primary"></i> Filter by Tag:
            </span>
            <div id="tagFilterButtons" class="d-flex gap-2 flex-wrap align-items-center">
                <!-- Tag filter pills rendered dynamically -->
            </div>
            <button id="btnClearTag" class="btn btn-sm btn-link text-warning text-decoration-none p-0 ms-2 fw-semibold" style="font-size: 11.5px; display: none;" onclick="setTag('', null)">
                ✕ Clear Tag Filter
            </button>
        </div>
    </div>
</div>

<!-- Cards Grid -->
<div id="repoGrid" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2 text-primary"></div>Loading knowledge base...
    </div>
</div>

<!-- Bottom Pagination Bar -->
<div class="card border-0 shadow-sm rounded-3 mt-4 p-3 bg-white">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
            <span id="repoPaginationInfo" class="text-muted small fw-medium" style="font-size: 12px;"></span>
            <div class="d-inline-flex align-items-center gap-1.5 ms-2">
                <label for="repoPageSizeSelect" class="text-muted small mb-0" style="font-size: 11.5px; white-space: nowrap;">Show:</label>
                <select id="repoPageSizeSelect" class="form-select form-select-sm py-0 px-2.5 text-dark fw-medium" style="font-size: 12px; height: 28px; width: auto; min-width: 68px; border-radius: 7px;" onchange="changeRepoPageSize(this.value)">
                    <option value="9" selected>9</option>
                    <option value="18">18</option>
                    <option value="36">36</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="1000">1000</option>
                    <option value="all">All</option>
                </select>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div id="activeFilterBadgeContainer" class="d-flex align-items-center gap-1.5 me-2"></div>
            <button class="btn btn-sm btn-outline-secondary px-3" style="font-size: 12px; border-radius: 6px;" id="repoBtnPrev" onclick="prevPage()" disabled>Previous</button>
            <button class="btn btn-sm btn-outline-secondary px-3" style="font-size: 12px; border-radius: 6px;" id="repoBtnNext" onclick="nextPage()" disabled>Next</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "/api";
    const CURRENT_USER_ROLE = "{{ session.get('role_name', 'Employee') }}";
    const IS_ADMIN = "{{ 'true' if (session.get('role_name', '')|lower in ['admin', 'administrator', 'system administrator'] or 'admin' in (session.get('role_name', '')|lower)) else 'false' }}" === "true";
    window.INITIAL_APPROVED_DECISIONS = {{ (initial_approved_decisions or []) | tojson | safe }};
</script>
<script src="{{ url_for('static', filename='js/repository.js') }}?v={{ range(1, 100000) | random }}"></script>
{% endblock %}
